name: Publish

# 两条触发路径：
#   1) 打 tag（如 v1.4.0）→ 自测 → 打包 → 发 Marketplace → 建同名 GitHub Release 并挂上 vsix
#   2) 手动触发 → 默认只验证 OIDC 凭据链，不上架（拿已发布的版本号去撞 --skip-duplicate）
#
# 认证走 trusted publishing（OIDC），不存任何 PAT：
#   vsce 向 GitHub 要一个 audience=marketplace.visualstudio.com 的 OIDC token，
#   再拿它到 Marketplace 换短期凭据。前置条件是 Marketplace 侧给 publisher 配好
#   trusted publishing policy（仓库 + workflow 文件名），见 RELEASING.md。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      verify_only:
        description: '只验证 OIDC 凭据链、不上架（需该版本已存在于 Marketplace）'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # 建 GitHub Release 并挂 vsix
      id-token: write # 换 Marketplace 短期凭据，缺它 vsce 会直接报错
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 装依赖
        run: npm ci

      - name: 仓内自测（脱敏样本，不需要语料仓）
        run: npm test

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的 v$V 不一致"
            exit 1
          fi

      # 钉住 vsce 版本：4.0.0 的 --oidc 交换请求没带 api-version，Marketplace 会返回
      # 'No api-version was supplied for the POST request' (400)；4.0.1-1 起已修。
      # 4.1.0（2026-10-28）是 Marketplace 开放 trusted publishing 时一起发布的正式版，
      # 包含 #1337「对齐 Marketplace 的 token 交换契约」与 #1345「X-Market-CI-Provider 头」，
      # 官方与社区实测都只要 ≥4.1.0；继续用 4.0.1-1 属于没被验证过的预发布版。
      - name: 打包（输出到 dist/）
        run: npm run package

      # Marketplace 侧的 trusted publishing 入口已开放（2026-10-28）：在 publisher 页
      # 「Trusted Publishing」里给 MiseHinoha/adb-sql-formatter + publish.yml 建一条 policy 即可。
      # 在仓库变量 MARKETPLACE_TRUSTED_PUBLISHING 设为 true 之前，推 tag 只做「自测 + 打包 + GitHub Release」，
      # 不尝试发市场 —— 这样在 policy 验证通过前，每次打 tag 都不会得到红色 CI。
      - name: 发布到 VS Code Marketplace
        if: ${{ !inputs.verify_only && vars.MARKETPLACE_TRUSTED_PUBLISHING == 'true' }}
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath dist/*.vsix

      - name: 说明：本次跳过 Marketplace 发布
        if: ${{ !inputs.verify_only && vars.MARKETPLACE_TRUSTED_PUBLISHING != 'true' }}
        run: |
          {
            echo "### 已跳过 Marketplace 发布（按设计）"
            echo ""
            echo "- 原因：仓库变量 MARKETPLACE_TRUSTED_PUBLISHING 还没设为 true（policy 配好并验证通过后才设）。"
            echo "- 现在怎么发：手工上传 \`dist/*.vsix\` —— publisher 页面 → 扩展行 ⋮ → Update（见 RELEASING.md 通道一）。"
            echo "- 切换方式：publisher 页建 trusted publishing policy → 跑一次 verify_only 验证 → 再把变量设为 true。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 仅验证凭据链（不上架）
        if: ${{ inputs.verify_only }}
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath dist/*.vsix

      - name: 建 GitHub Release 并挂上 vsix
        if: startsWith(github.ref, 'refs/tags/') && !inputs.verify_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.vsix --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
